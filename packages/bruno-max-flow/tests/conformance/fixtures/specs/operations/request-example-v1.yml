openapi: 3.0.3
# B4.6: one operation whose request body declares an example, and one whose body declares a schema
# and no example — the seed-from-spec control's two outcomes, from a single document.
info: { title: Seed-from-spec corpus, version: 1.0.0 }
paths:
  /charges:
    post:
      operationId: createCharge
      requestBody:
        content:
          application/json:
            schema: { type: object }
            example: { amount: 900, currency: usd }
      responses:
        '201': { description: Created }
  /refunds:
    post:
      operationId: createRefund
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Created }

# R8.7's sub-flow: a library flow with an interface — a required param, and an export the caller
# reads as the invoking step's own output (§12.1).
version: 1

meta:
  name: R8 — login
  library: true

apis:
  regress-api: ../../specs/regressions-v1.yml

config:
  baseUrl: "{{regressBaseUrl}}"

params:
  email: { required: true }

exports:
  token: steps.login.token

steps:
  - id: login
    operation: regress-api#signIn
    body:
      email: "{{params.email}}"
    outputs:
      token: data.token

# 006 §1's third loop (the Xero payable library): read ledger-object pages until enough items match a
# filter. The cursor is the page number plus one, which `next:` takes from `ctx.loop.page`, and the
# matches are collected across pages by each iteration reading `ctx.loop.previous`.
version: 1

meta:
  name: 006 — a page cursor that collects results across pages

apis:
  loops-api: ../../specs/loops-v1.yml

steps:
  - id: read_pages
    operation: loops-api#loopListObjects
    loop:
      start: 1
      next: |
        (previous, ctx) => previous.hasMore ? ctx.loop.page + 1 : null
      as: page
      until: |
        (res, ctx) => ctx.outputs.matches.length >= 3
      max: 10
    query:
      page: "{{loop.page}}"
    outputs:
      hasMore: has_more
      matches:
        script: |
          (res, ctx) => (ctx.loop.previous ? ctx.loop.previous.matches : [])
            .concat(res.body.data.filter((item) => item.kind === 'payable'))

  - id: use_matches
    operation: loops-api#loopRpc
    when: steps.read_pages.matched eq true
    body:
      key: "{{steps.read_pages.matches[0].id}}"

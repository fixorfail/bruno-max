# The sub-flow half of §12.3's `config:` inheritance: it declares no `config:` at all, so every
# default it runs under is the caller's.
version: 1

meta:
  name: config inheritance — a sub-flow declaring nothing
  library: true

apis:
  regress-api: ../../specs/regressions-v1.yml

steps:
  - id: use
    operation: regress-api#createThing
    body:
      name: child

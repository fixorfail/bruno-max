# §14.4's primary mechanism, with a secret from each of the three sources the engine tracks: a
# host's `secret: true` environment value, a `secret: true` param (§12.5), and an auth profile's
# credential field.
#
# The stub echoes the environment value and the profile's password back in the response, which is
# what a service rejecting a credential does and the case §14.4 names: a secret is masked wherever
# it *subsequently* appears, not only where the flow wrote it. `use_token` is the counterweight —
# what it sends on the wire has to be the real token, or the flow no longer works.
version: 1

meta:
  name: provenance by value

apis:
  regress-api: ../../specs/regressions-v1.yml

config:
  baseUrl: "{{regressBaseUrl}}"

shared: [sessionToken]

params:
  tenantPassword:
    required: true
    secret: true

authProfiles:
  operator: { mode: basic, username: ops, password: profile_pw_9 }

steps:
  - id: sign_in
    operation: regress-api#signIn
    auth: operator
    body:
      email: "{{testUserEmail}}"
      password: "{{params.tenantPassword}}"
    outputs:
      token: data.token
      role: data.role
    shared:
      sessionToken: token
    assert:
      - res.body.data.token eq "{{tenantApiKey}}"

  - id: use_token
    operation: regress-api#createThing
    # §14.4's own example of what a name-based rule cannot catch: a credential in a query string,
    # here by way of the shared slot the value was promoted into (§9.1).
    query:
      token: "{{shared.sessionToken}}"
    headers:
      X-Token: "{{steps.sign_in.token}}"
    body:
      name: widget
      ref: "{{shared.sessionToken}}"

  - id: reject
    operation: regress-api#getState
    outputs:
      audit:
        script: |
          (res, ctx) => { throw new Error(`rejected ${ctx.params.tenantPassword}`); }

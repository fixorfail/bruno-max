# R9.10 — §6.4's implicit `collection` profile. Nothing here declares it: it is the host's to supply
# through `RunOptions.authProfiles`, and a flow that declares a profile of the same name wins.
version: 1

meta:
  name: R9.10 — host-supplied auth profiles

apis:
  regress-api:
    source: ../../specs/regressions-v1.yml
    auth: collection

config:
  baseUrl: "{{regressBaseUrl}}"

steps:
  # Through the binding's `auth:` — the case a collection flow calling one API never spells out.
  - id: through_binding
    operation: regress-api#createThing
    body:
      name: widget

  # Named on the step, over a binding that already resolves to it.
  - id: on_step
    operation: regress-api#getThing
    auth: collection
    pathParams:
      id: thing-1

  - id: opted_out
    operation: regress-api#getState
    auth: none

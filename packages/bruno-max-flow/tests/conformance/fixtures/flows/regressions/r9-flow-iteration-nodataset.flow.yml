# §7.3 and §9.4 — `flow.iteration` is listed unconditionally, and a flow with no `dataset:` runs a
# single iteration whose index is 0. So the reference resolves rather than leaving a placeholder on
# the wire, and a flow can interpolate it without knowing whether a dataset will be added later.
version: 1

meta:
  name: R9 — flow.iteration outside a dataset

apis:
  regress-api: ../../specs/regressions-v1.yml

config:
  baseUrl: "{{regressBaseUrl}}"

steps:
  - id: create
    operation: regress-api#createThing
    body:
      name: widget
      count: "{{flow.iteration}}"

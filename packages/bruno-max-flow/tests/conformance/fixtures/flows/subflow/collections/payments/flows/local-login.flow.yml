# R12.1's collection-local sub-flow — reached by an ordinary relative path from a sibling caller,
# to show a `workspace:` prefix is not needed when the target already lives inside scope (§12.2).
version: 1

meta:
  name: R12 — local login
  library: true

apis:
  regress-api: ../../../../../specs/regressions-v1.yml

config:
  baseUrl: "{{regressBaseUrl}}"

params:
  email: { required: true }

exports:
  token: steps.login.token

steps:
  - id: login
    operation: regress-api#signIn
    body:
      email: "{{params.email}}"
    outputs:
      token: data.token

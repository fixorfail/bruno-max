# The workspace's shared login: `login` declares no outputs, and both exports name what the workspace
# connector file supplies (§8.5, §12.3).
version: 1

meta:
  name: R10 — shared login
  library: true

apis:
  regress-api: ../../../../specs/regressions-v1.yml

config:
  baseUrl: "{{regressBaseUrl}}"

params:
  email: { required: true }

exports:
  token: steps.login.token
  role: steps.login.role

steps:
  - id: login
    operation: regress-api#signIn
    auth: none
    body:
      email: "{{params.email}}"

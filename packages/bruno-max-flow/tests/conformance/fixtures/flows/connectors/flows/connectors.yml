# §8.5's workspace connector file: the outputs every flow under this workspace inherits for the
# operations named here. The collection file under `collections/payments/` layers over it — `title`
# exists to be overridden there, and `role` to be suppressed.
version: 1

apis:
  regress-api: ../../../specs/regressions-v1.yml
  # R10.7: a binding whose `source:` is relative to *this* file. The shared library under
  # `flows/shared/` reaches the same document by a different relative path, and inherits these
  # because the match is on where each side's path resolves to, not on the string either wrote.
  shared-svc:
    source: ../../../specs/paced-other-v1.yml
    baseUrl: https://workspace-scope.example.com
    defaultHeaders:
      X-Scope: workspace

connectors:
  regress-api#signIn:
    token: data.token
    role: data.role

  regress-api#getThing:
    thingId: data.id
    title: data.id

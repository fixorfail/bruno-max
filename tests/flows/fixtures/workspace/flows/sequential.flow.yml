version: 1

meta:
  name: Sequential branches

apis:
  orders: ../apispec/orders-v1.yml

config:
  concurrency: 1

steps:
  - id: create_order
    operation: orders#createOrder
    body:
      id: ord_1
    outputs:
      orderId: id

  - id: wait_left
    operation: orders#awaitOrder
    depends: [create_order]
    query:
      time: 3000

  - id: wait_right
    operation: orders#awaitOrder
    depends: [create_order]
    query:
      time: 3000

  - id: rejoin
    operation: orders#getOrder
    depends: [wait_left, wait_right]
